[package]
name = "freenet-mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Embeddable Freenet node with a UniFFI surface for mobile hosts"
license-file = "../core/LICENSE.md"
repository = "https://github.com/freenet/freenet-core"

[lib]
name = "freenet_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
anyhow = { workspace = true }
# Compile the interpreter for iOS, where Config selects it instead of the JIT.
# CI tests both core feature states explicitly, outside workspace unification.
freenet = { path = "../core", features = ["pulley"] }
freenet-stdlib = { features = ["net"], workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
# Must match the tokio-tungstenite that `freenet_stdlib::client_api::WebApi::start`
# is typed against (its `net` feature pins 0.27).
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
uniffi = { version = "0.32", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints.rust]
# Mirrors crates/core: discarded Results/Options on #[must_use] are compile errors.
unused_must_use = "deny"
# Require `unsafe` blocks to carry a `// SAFETY: ...` comment.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
