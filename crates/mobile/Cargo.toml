[package]
name = "freenet-mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Embeddable Freenet node with a UniFFI surface for mobile hosts"
license-file = "../core/LICENSE.md"
repository = "https://github.com/freenet/freenet-core"

[lib]
name = "freenet_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow = { workspace = true }
# `pulley` compiles wasmtime's interpreter backend so contracts can run without
# JIT (iOS forbids it). `Config::use_pulley` defaults to true on iOS and false
# elsewhere, so host tests still exercise the Cranelift JIT.
#
# LOAD-BEARING beyond this crate's own build: this crate is a workspace
# member, so a `--workspace` cargo/nextest invocation unifies features across
# members and this line is what turns `pulley` on for `freenet` in that build
# — it is how crates/core's pulley-gated tests have been running in CI at
# all. `.github/workflows/ci.yml`'s `test_unit` job now also runs them
# explicitly against `-p freenet` alone ("Test pulley" / "Test pulley
# feature-off refusal"), so removing `features = ["pulley"]` from this line
# no longer silently drops that coverage — but it would still change what the
# main `--workspace` step above builds and tests, so treat this line as
# read by that CI job, not just by this crate's own Cargo.toml.
freenet = { path = "../core", features = ["pulley"] }
freenet-stdlib = { features = ["net"], workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
# Must match the tokio-tungstenite that `freenet_stdlib::client_api::WebApi::start`
# is typed against (its `net` feature pins 0.27).
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
uniffi = { version = "0.32", features = ["tokio", "cli"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints.rust]
# Mirrors crates/core: discarded Results/Options on #[must_use] are compile errors.
unused_must_use = "deny"
# Require `unsafe` blocks to carry a `// SAFETY: ...` comment.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
